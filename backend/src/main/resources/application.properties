spring.application.name=SimCC-Backend
# ===============================
# = DATA SOURCE
# ===============================
# Set here configurations for the database connection
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1
# ===============================
# = JPA / HIBERNATE
# ===============================
# Show or not log for each sql query
spring.jpa.show-sql=true
# Hibernate ddl auto (create, create-drop, update): with "create-drop" the database
# schema will be automatically created afresh for every start of application
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# Spring Security (shows why requests are rejected)
logging.level.org.springframework.security=DEBUG

# WebSocket
logging.level.org.springframework.web.socket=DEBUG

# For reverse-proxy
server.servlet.context-path=/api

# general
simcc.docker.host=${DOCKER_SOCK:/var/run/docker.sock}
simcc.docker.tls=false

# builder
simcc.builder.image-tag=simcc_trojan_builder:latest
## defaults
simcc.builder.defaults.host=${SIMCC_HOST}
simcc.builder.defaults.http_commander_reconnect=${SIMCC_HTTP_COMMANDER_RECONNECT}
simcc.builder.defaults.ws_commander_reconnect=${SIMCC_WS_COMMANDER_RECONNECT}

# redis
spring.data.redis.host=redis
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.port=6379

spring.session.store-type=redis
spring.session.timeout=30m
spring.session.redis.namespace=spring:session

server.servlet.session.persistent=false